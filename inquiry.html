<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sara Luxe Glam — Inquiry</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #000; --fg: #fff; --line: rgba(255,255,255,0.55); --line-soft: rgba(255,255,255,0.25); }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--fg); margin: 0; min-height: 100%; }
  body {
    font-family: 'Cormorant', serif;
    padding: 48px 20px 80px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-weight: 700;
    letter-spacing: 4px;
    font-size: clamp(22px, 5vw, 32px);
    margin: 0 0 6px;
  }
  .sub {
    text-align: center;
    font-size: clamp(20px, 4vw, 26px);
    font-weight: 400;
    color: var(--fg);
    margin: 0 0 44px;
    letter-spacing: 0.5px;
  }
  form { display: flex; flex-direction: column; gap: 30px; }
  label {
    display: block;
    font-size: 20px;
    margin-bottom: 8px;
  }
  label .req { opacity: 0.7; }
  input, select, textarea {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--fg);
    font-family: 'Cormorant', serif;
    font-size: 20px;
    padding: 6px 2px;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    border-radius: 0;
  }
  input:focus, select:focus, textarea:focus { border-bottom-color: var(--fg); }
  textarea { resize: vertical; min-height: 44px; }
  select { cursor: pointer; }
  select option { background: #111; color: #fff; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
  .hp { position: absolute; left: -9999px; top: -9999px; opacity: 0; height: 0; width: 0; }
  button[type="submit"] {
    margin: 10px auto 0;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--fg);
    font-family: 'Cormorant', serif;
    font-size: 22px;
    letter-spacing: 1px;
    padding: 4px 26px 8px;
    cursor: pointer;
  }
  button[type="submit"]:hover { border-bottom-color: var(--fg); }
  button[type="submit"]:disabled { opacity: 0.5; cursor: default; }
  .actions { text-align: center; }
  .err { color: #ff8a8a; font-size: 16px; text-align: center; margin-top: -14px; }
  .done {
    text-align: center;
    padding: 60px 10px;
  }
  .done h2 {
    font-weight: 700;
    letter-spacing: 1px;
    font-size: 28px;
    margin-bottom: 14px;
  }
  .done p { font-size: 19px; line-height: 1.6; color: rgba(255,255,255,0.85); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SARA LUXE GLAM</h1>
  <div class="sub">Tell me about your day</div>

  <form id="inquiryForm">
    <input type="text" name="_hp" class="hp" tabindex="-1" autocomplete="off" />

    <div>
      <label>Your name <span class="req">*</span></label>
      <input type="text" id="f_name" required />
    </div>

    <div>
      <label>Your email <span class="req">*</span></label>
      <input type="email" id="f_email" required />
    </div>

    <div>
      <label>Your message</label>
      <textarea id="f_message" rows="2"></textarea>
    </div>

    <div>
      <label>Contact number <span class="req">*</span></label>
      <input type="tel" id="f_phone" required />
    </div>

    <div>
      <label>Prefered time to contact <span class="req">*</span></label>
      <input type="text" id="f_contactTime" placeholder="e.g. evenings after 6pm" required />
    </div>

    <div>
      <label>Location of the event <span class="req">*</span></label>
      <input type="text" id="f_location" required />
    </div>

    <div>
      <label>Date of Event <span class="req">*</span></label>
      <input type="date" id="f_eventDate" required />
    </div>

    <div>
      <label>Event Type <span class="req">*</span></label>
      <select id="f_eventType" required>
        <option value="" disabled selected></option>
        <option>Wedding (I'm the Bride)</option>
        <option>Wedding (I'm a attendee)</option>
        <option>Engagement</option>
        <option>Photoshoot</option>
        <option>Prom</option>
        <option>Special Event</option>
        <option>Makeup class</option>
        <option>Flim</option>
        <option>Other ( Kindly specify in your message field)</option>
      </select>
    </div>

    <div>
      <label>Desired ready time <span class="req">*</span></label>
      <input type="text" id="f_readyTime" placeholder="e.g. 9:00 AM" required />
    </div>

    <div>
      <label>How many makeup services are you looking for? <span class="req">*</span></label>
      <select id="f_makeupQty" required>
        <option value="" disabled selected></option>
        <option value="0">0 (No makeup service, only hair service)</option>
        <option>1</option><option>2</option><option>3</option><option>4</option>
        <option>5</option><option>6</option><option>7</option><option>8</option>
        <option>9</option><option>10+</option>
      </select>
    </div>

    <div>
      <label>How many hair services are you looking for? <span class="req">*</span></label>
      <select id="f_hairQty" required>
        <option value="" disabled selected></option>
        <option value="0">0 ( No hair service, only makeup service)</option>
        <option>1</option><option>2</option><option>3</option><option>4</option>
        <option>5</option><option>6</option><option>7</option><option>8</option>
        <option>9</option><option>10+</option>
      </select>
    </div>

    <div>
      <label>How did you hear about us? <span class="req">*</span></label>
      <select id="f_source" required>
        <option value="" disabled selected></option>
        <option>Google</option>
        <option>Instagram</option>
        <option>Facebook</option>
        <option>Friend</option>
        <option>Weddingwire</option>
        <option>The Knot</option>
        <option>Other</option>
      </select>
    </div>

    <div class="err hidden" id="errMsg"></div>

    <div class="actions">
      <button type="submit" id="submitBtn">Send</button>
    </div>
  </form>

  <div class="done hidden" id="doneMsg">
    <h2>Thank you</h2>
    <p>Your message has been sent.<br />I'll be in touch soon 🤍</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
  var form = document.getElementById("inquiryForm");
  var errEl = document.getElementById("errMsg");
  var btn = document.getElementById("submitBtn");

  var supabaseClient = null;
  try {
    supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  } catch (e) {
    console.error("Supabase is not configured yet:", e.message);
  }
  if (!supabaseClient) {
    btn.disabled = true;
    btn.textContent = "Send";
    errEl.textContent = "This form isn't fully set up yet — please reach out by phone or email instead.";
    errEl.classList.remove("hidden");
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!supabaseClient) return;
    errEl.classList.add("hidden");

    // Honeypot — bots tend to fill every field, real visitors never see this one
    if (form._hp.value) return;

    var answers = {
      name: document.getElementById("f_name").value.trim(),
      email: document.getElementById("f_email").value.trim(),
      message: document.getElementById("f_message").value.trim(),
      phone: document.getElementById("f_phone").value.trim(),
      preferredContactTime: document.getElementById("f_contactTime").value.trim(),
      location: document.getElementById("f_location").value.trim(),
      eventDate: document.getElementById("f_eventDate").value,
      eventType: document.getElementById("f_eventType").value,
      readyTime: document.getElementById("f_readyTime").value.trim(),
      makeupQty: document.getElementById("f_makeupQty").value,
      hairQty: document.getElementById("f_hairQty").value,
      source: document.getElementById("f_source").value,
    };

    btn.disabled = true;
    btn.textContent = "Sending…";

    var { error } = await supabaseClient.from("inquiries").insert({ answers: answers });

    if (error) {
      console.error(error);
      errEl.textContent = "Something went wrong — please try again, or reach out directly.";
      errEl.classList.remove("hidden");
      btn.disabled = false;
      btn.textContent = "Send";
      return;
    }

    form.classList.add("hidden");
    document.getElementById("doneMsg").classList.remove("hidden");
  });
</script>
</body>
</html>
